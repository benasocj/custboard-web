name: custboard
description: Custboard Web
version: 0.0.1
environment:
  sdk: '>=1.13.0 <2.0.0'
dependencies:
  angular2: ^3.1.0
  angular_components: ^0.5.2
  charted: ^0.4.6
  http: ^0.11.0
  intl: ^0.15.0
dev_dependencies:
  angular_test: ^1.0.0-beta
  browser: ^0.10.0
  dart_to_js_script_rewriter: ^1.0.1
  test: ^0.12.0
transformers:
  - angular2/transform/codegen:
      platform_directives:
        - 'package:angular2/common.dart#COMMON_DIRECTIVES'
      platform_pipes:
        - 'package:angular2/common.dart#COMMON_PIPES'
      entry_points: web/main.dart
      # TODO: Remove once https://github.com/dart-lang/angular2/issues/85 is
      # fixed.
      resolved_identifiers:
        BaseClient: 'package:http/http.dart'
        BrowserClient: 'package:http/browser_client.dart'
        Api: 'package:custboard/api.dart'
  - dart_to_js_script_rewriter
  - angular2/transform/reflection_remover:
      $include:
        - test/**_test.dart
        - web/main.dart
  - test/pub_serve:
      $include: test/**_test.dart
